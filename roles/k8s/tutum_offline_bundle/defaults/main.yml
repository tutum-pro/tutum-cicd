---
# k8s_tutum_offline_bundle role defaults
# Prepare offline bundle for air-gapped/on-prem Tutum Platform installation

# ==================== Container Runtime ====================

# Container runtime to use: docker or podman
#
# Podman is commonly used in:
# - OpenShift environments (always)
# - RHEL, Oracle Linux, Fedora, Rocky Linux, AlmaLinux
# - Air-gapped corporate environments
# - Rootless container deployments
#
# Docker is commonly used in:
# - Standard Kubernetes (upstream, EKS, AKS, GKE)
# - Ubuntu, Debian based systems
# - Development environments
#
# Both have compatible CLI interfaces.
# Default: "docker" (most universal)
# For OpenShift/RHEL: explicitly set to "podman"
k8s_tutum_offline_container_runtime: "docker"

# ==================== Output Configuration ====================

# Output directory for the bundle
k8s_tutum_offline_output_path: "./tutum-offline-bundle"

# Archive name (without extension)
k8s_tutum_offline_archive_name: "tutum-k8s-offline-bundle"

# Include timestamp in archive name
k8s_tutum_offline_archive_timestamp: true

# Create output directory if not exists
k8s_tutum_offline_create_dir: true

# ==================== Configuration Source ====================

# Path to inventory file (k8s.ini) to read configuration from
# If empty, uses default configuration
k8s_tutum_offline_inventory_path: ""

# ==================== Component Selection ====================

# Database mode: embedded, cnpg, external
# Determines which database images to include
k8s_tutum_offline_db_mode: "embedded"

# Certificate injection mode: csi, operator
k8s_tutum_offline_injection_mode: "operator"

# Kubernetes distribution (affects CSI kubelet paths)
k8s_distribution: "standard"

# Target platform/architecture for images
# Default: linux/amd64 (most Kubernetes clusters run on amd64)
# Options: linux/amd64, linux/arm64
k8s_tutum_offline_platform: "linux/amd64"

# ==================== Internal Registry Configuration ====================

# Internal registry address (for retagging images)
# Example: "registry.internal.example.com:5000"
k8s_tutum_offline_internal_registry: ""

# Internal registry prefix/namespace
# Example: "tutum" -> registry.internal.example.com:5000/tutum/image:tag
k8s_tutum_offline_internal_prefix: "tutum"

# Save retagged images (with internal registry prefix)
k8s_tutum_offline_save_retagged: true

# ==================== Source Registry Credentials ====================
# Credentials for pulling images from source registries
# Required for private registries (e.g., private Docker Hub, ghcr.io with auth)
# Leave empty for public registries

# Docker Hub credentials (for tutumpro/* images)
k8s_tutum_offline_dockerhub_username: ""
k8s_tutum_offline_dockerhub_password: ""

# GitHub Container Registry credentials (for ghcr.io/* images like CNPG)
k8s_tutum_offline_ghcr_username: ""
k8s_tutum_offline_ghcr_token: ""

# ==================== Target Registry Credentials ====================
# Credentials for pushing images to internal/target registry
# These will be included in the bundle for push-images.sh script

k8s_tutum_offline_target_registry_username: ""
k8s_tutum_offline_target_registry_password: ""
k8s_tutum_offline_target_registry_email: ""

# Name of imagePullSecret to create in Kubernetes
k8s_tutum_offline_registry_secret_name: "tutum-registry-secret"

# ==================== Component Versions ====================

# Tutum Platform components
k8s_tutum_engine_version: "5.1.5"
k8s_tutum_csi_version: "4.0.1"
k8s_tutum_operator_version: "0.1.12"

# PostgreSQL (embedded mode)
k8s_tutum_postgres_version: "15-alpine"

# CNPG (cnpg mode)
k8s_tutum_cnpg_operator_version: "1.25.0"
k8s_tutum_cnpg_postgres_version: "16"

# CSI sidecar versions
k8s_csi_provisioner_version: "v3.6.0"
k8s_csi_node_driver_registrar_version: "v2.9.0"

# ==================== Image Registries ====================

# Tutum Platform images
k8s_tutum_engine_image: "tutumpro/tutum-engine"
k8s_tutum_csi_image: "tutumpro/tutum-csi-driver-k8s"
k8s_tutum_operator_image: "tutumpro/tutum-operator-k8s"

# PostgreSQL images
k8s_tutum_postgres_image: "postgres"
k8s_tutum_cnpg_operator_image: "ghcr.io/cloudnative-pg/cloudnative-pg"
k8s_tutum_cnpg_postgres_image: "ghcr.io/cloudnative-pg/postgresql"

# CSI sidecar images
k8s_csi_provisioner_image: "registry.k8s.io/sig-storage/csi-provisioner"
k8s_csi_node_driver_registrar_image: "registry.k8s.io/sig-storage/csi-node-driver-registrar"

# ==================== Ansible Collection ====================

# Include Ansible collection in bundle
k8s_tutum_offline_include_collection: true

# Collection version (empty = latest)
k8s_tutum_offline_collection_version: ""

# Collection source
# Options: galaxy, git, local
k8s_tutum_offline_collection_source: "galaxy"

# Collection name
k8s_tutum_offline_collection_name: "tutum_pro.cicd"

# Git repository URL (when source=git)
k8s_tutum_offline_collection_git_url: "https://github.com/tutum-pro/tutum-cicd.git"

# Local path to collection (when source=local)
k8s_tutum_offline_collection_local_path: ""

# ==================== Bundle Contents ====================

# Include installation scripts
k8s_tutum_offline_include_scripts: true

# Include sample inventory
k8s_tutum_offline_include_sample_inventory: true

# Include README
k8s_tutum_offline_include_readme: true
