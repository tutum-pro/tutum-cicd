# Ansible Collection: tutum_pro.cicd
# https://docs.ansible.com/ansible/latest/dev_guide/developing_collections.html
---
namespace: tutum_pro
name: cicd
version: "1.7.0"
readme: README.md
authors:
  - Tutum Pro Team

description: |
  Ansible collection for deploying Tutum Pro certificate management platform.
  Supports both Docker and Kubernetes deployments.

  Docker roles:
    - tutum_engine: Tutum Engine container
    - tutum_postgres: PostgreSQL database container
    - tutum_plugin: Docker volume plugin for certificates
    - tutum_cli: Admin CLI container
    - tutum_init: Installation file generator

  Kubernetes roles:
    - k8s.tutum_engine: Tutum Engine Deployment
    - k8s.tutum_csi: CSI Driver for certificate volumes
    - k8s.tutum_init: K8s installation playbook generator

license:
  - MIT

tags:
  - tutum
  - certificates
  - x509
  - pki
  - docker
  - kubernetes
  - csi
  - csi_driver

dependencies:
  kubernetes.core: ">=2.4.0"

repository: https://github.com/tutum-pro/tutum-cicd
documentation: https://www.tutum-pro.io
homepage: https://github.com/tutum-pro/tutum-cicd
issues: https://github.com/tutum-pro/tutum-cicd/issues

build_ignore:
  - .git
  - .gitignore
  - .vscode
  - .ansible
  - .ansible_cache
  - logs
  - "*.tar.gz"
  - inventory/docker.ini
  - host_vars
