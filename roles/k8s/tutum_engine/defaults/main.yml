---
# k8s_tutum_engine role defaults

# Component versions
# IMPORTANT: These values MUST be synchronized with the respective role defaults:
#   - k8s_tutum_engine_version -> roles/k8s/tutum_engine/defaults/main.yml (this file)
#   - k8s_tutum_csi_version    -> roles/k8s/tutum_csi/defaults/main.yml
k8s_tutum_engine_version: "5.1.5"

# Namespace
k8s_tutum_namespace: "tutum-system"

# ==================== Kubectl Configuration ====================
# Kubectl command (inherits from k8s_kubectl_command if set, otherwise auto-detects)
k8s_kubectl_command: "{{ k8s_kubectl_command | default('kubectl') }}"

# KUBECONFIG path (optional)
k8s_kubectl_kubeconfig: "{{ k8s_kubectl_kubeconfig | default('') }}"

# Full kubectl command with env vars
k8s_kubectl: >-
  {{ 'KUBECONFIG=' + k8s_kubectl_kubeconfig + ' ' if k8s_kubectl_kubeconfig | length > 0 else '' }}{{ k8s_kubectl_command }}

# Deployment configuration
k8s_tutum_engine_replicas: 1
k8s_tutum_engine_image: "tutumpro/tutum-engine"
k8s_tutum_engine_image_pull_policy: "Always"

# Resource limits
k8s_tutum_engine_resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Service configuration
k8s_tutum_engine_service_type: "ClusterIP"
k8s_tutum_engine_http_port: 8080
k8s_tutum_engine_grpc_port: 9090
k8s_tutum_engine_metrics_port: 9091

# Ingress configuration
k8s_tutum_engine_ingress_enabled: false
# Ingress class name - auto-selected based on Kubernetes distribution
# OpenShift: nginx (recommended for corporate environments)
# Standard/microk8s: nginx or "public" for microk8s default
k8s_tutum_engine_ingress_class_name: "{{ 'nginx' if (k8s_distribution | default('standard')) == 'openshift' else 'nginx' }}"
k8s_tutum_engine_ingress_host: ""  # e.g., "tutum.example.com" (empty = no host-based routing)
k8s_tutum_engine_ingress_path: "/api"
k8s_tutum_engine_ingress_path_type: "Prefix"
k8s_tutum_engine_ingress_tls_enabled: false
k8s_tutum_engine_ingress_tls_secret_name: ""  # e.g., "tutum-tls" (empty = use default or cert-manager)
k8s_tutum_engine_ingress_grpc_enabled: false
k8s_tutum_engine_ingress_grpc_host: ""  # e.g., "grpc.tutum.example.com"
k8s_tutum_engine_ingress_annotations:
  nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  nginx.ingress.kubernetes.io/ssl-redirect: "false"
# For cert-manager, add:
#   cert-manager.io/cluster-issuer: "letsencrypt-prod"

# PostgreSQL connection
# If k8s_tutum_external_db_url is set, external PostgreSQL will be used
# and tutum_postgres role should be skipped
# Format: postgres://user:password@host:port/dbname?sslmode=disable
k8s_tutum_external_db_url: ""

# For external PostgreSQL (when k8s_tutum_external_db_url is empty but host is set)
# If both k8s_tutum_external_db_url and k8s_tutum_postgres_host are empty,
# embedded PostgreSQL from tutum_postgres role will be used
k8s_tutum_postgres_host: ""  # e.g., "192.168.0.63" or "postgres.example.com"
k8s_tutum_postgres_port: "5432"
k8s_tutum_postgres_sslmode: "disable"

# Database configuration (used for both embedded and external)
k8s_tutum_db_name: "tutum"
k8s_tutum_db_user: "tutum"
k8s_tutum_db_password: "tutum"  # Use ansible-vault in production!

# Security keys (IMPORTANT: Override in production!)
# These keys MUST be exactly 32 characters for AES-256 encryption
k8s_tutum_master_key: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
k8s_tutum_jwt_secret: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"

# Application configuration
k8s_tutum_log_level: "info"
k8s_tutum_enable_metrics: "true"
k8s_tutum_create_not_existing_obj: "true"
k8s_tutum_pod_restart_enabled: "true"

# REST API base path (for multi-instance deployments)
# Allows running multiple tutum-engine instances on the same cluster
# Example: "/api" or "/tutum/api" or "/instance1/api"
# If empty, tutum-engine uses default base path
k8s_tutum_rest_base_path: ""

# Webhook configuration (for tutum-operator-k8s integration)
k8s_tutum_webhook_enabled: "true"
k8s_tutum_webhook_endpoints: "http://tutum-operator-webhook.{{ k8s_tutum_namespace }}.svc:8082/webhook/certificate-change"

# Kubernetes distribution for kubelet paths
# Options: "standard", "microk8s", "k3s", "rke2", "openshift"
k8s_distribution: "standard"

# Kubelet paths per distribution
k8s_kubelet_paths:
  standard: "/var/lib/kubelet"
  microk8s: "/var/snap/microk8s/common/var/lib/kubelet"
  k3s: "/var/lib/rancher/k3s/agent"
  rke2: "/var/lib/rancher/rke2/agent"
  openshift: "/var/lib/kubelet"

# Image registry credentials (for private registries)
# Leave empty for public registries like Docker Hub
k8s_tutum_registry_url: ""
k8s_tutum_registry_username: ""
k8s_tutum_registry_password: ""
k8s_tutum_registry_email: ""
k8s_tutum_registry_secret_name: "tutum-registry-secret"

# Action: present or absent
k8s_tutum_engine_state: "present"
