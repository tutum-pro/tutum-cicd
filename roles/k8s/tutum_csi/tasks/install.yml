---
# k8s_tutum_csi - Installation tasks

# ==================== Validation ====================
- name: Validate k8s_distribution
  ansible.builtin.assert:
    that:
      - k8s_distribution in _k8s_kubelet_paths.keys()
    fail_msg: |
      Invalid k8s_distribution: '{{ k8s_distribution }}'
      Valid options: {{ _k8s_kubelet_paths.keys() | list }}

- name: Check kubectl connectivity
  ansible.builtin.command: kubectl cluster-info
  changed_when: false

- name: Set kubelet path based on distribution
  ansible.builtin.set_fact:
    _k8s_kubelet_path: "{{ _k8s_kubelet_paths[k8s_distribution] }}"

- name: Display configuration
  ansible.builtin.debug:
    msg:
      - "Kubernetes distribution: {{ k8s_distribution }}"
      - "Kubelet path: {{ _k8s_kubelet_path }}"
      - "Tutum Engine URL: {{ k8s_tutum_engine_url }}"

# ==================== Namespace ====================
- name: Ensure namespace exists
  ansible.builtin.shell: kubectl create namespace {{ k8s_tutum_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

# ==================== RBAC ====================
- name: Generate RBAC manifest
  ansible.builtin.template:
    src: rbac.yml.j2
    dest: /tmp/tutum-csi-rbac.yml
    mode: '0600'

- name: Apply RBAC resources
  ansible.builtin.command: kubectl apply -f /tmp/tutum-csi-rbac.yml
  changed_when: true

# ==================== CSIDriver ====================
- name: Generate CSIDriver manifest
  ansible.builtin.template:
    src: csidriver.yml.j2
    dest: /tmp/tutum-csi-driver.yml
    mode: '0600'

- name: Apply CSIDriver resource
  ansible.builtin.command: kubectl apply -f /tmp/tutum-csi-driver.yml
  changed_when: true

# ==================== Controller Deployment ====================
- name: Generate CSI Controller manifest
  ansible.builtin.template:
    src: controller.yml.j2
    dest: /tmp/tutum-csi-controller.yml
    mode: '0600'

- name: Apply CSI Controller
  ansible.builtin.command: kubectl apply -f /tmp/tutum-csi-controller.yml
  changed_when: true

# ==================== Node DaemonSet ====================
- name: Generate CSI Node DaemonSet manifest
  ansible.builtin.template:
    src: daemonset.yml.j2
    dest: /tmp/tutum-csi-daemonset.yml
    mode: '0600'

- name: Apply CSI Node DaemonSet
  ansible.builtin.command: kubectl apply -f /tmp/tutum-csi-daemonset.yml
  changed_when: true

# ==================== StorageClass ====================
- name: Generate StorageClass manifest
  ansible.builtin.template:
    src: storageclass.yml.j2
    dest: /tmp/tutum-csi-storageclass.yml
    mode: '0600'

- name: Apply StorageClass
  ansible.builtin.command: kubectl apply -f /tmp/tutum-csi-storageclass.yml
  changed_when: true

# ==================== Cleanup temp files ====================
- name: Remove temporary manifest files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/tutum-csi-rbac.yml
    - /tmp/tutum-csi-driver.yml
    - /tmp/tutum-csi-controller.yml
    - /tmp/tutum-csi-daemonset.yml
    - /tmp/tutum-csi-storageclass.yml

# ==================== Wait for Deployment ====================
- name: Wait for CSI Controller to be ready
  ansible.builtin.command: >
    kubectl rollout status deployment/tutum-csi-controller
    -n {{ k8s_tutum_namespace }} --timeout=300s
  changed_when: false

- name: Wait for CSI Node DaemonSet to be ready
  ansible.builtin.command: >
    kubectl rollout status daemonset/tutum-csi-node
    -n {{ k8s_tutum_namespace }} --timeout=300s
  changed_when: false

# ==================== Verification ====================
- name: Verify CSIDriver is registered
  ansible.builtin.command: kubectl get csidriver {{ k8s_tutum_csi_driver_name }}
  changed_when: false

- name: Get CSI Controller status
  ansible.builtin.command: >
    kubectl get deployment tutum-csi-controller -n {{ k8s_tutum_namespace }}
    -o jsonpath='{.status.readyReplicas}'
  register: _csi_controller_ready
  changed_when: false

- name: Get CSI Node status
  ansible.builtin.command: >
    kubectl get daemonset tutum-csi-node -n {{ k8s_tutum_namespace }}
    -o jsonpath='{.status.numberReady}/{.status.desiredNumberScheduled}'
  register: _csi_node_ready
  changed_when: false

- name: Display installation result
  ansible.builtin.debug:
    msg:
      - "Tutum CSI Driver deployed successfully!"
      - ""
      - "Namespace: {{ k8s_tutum_namespace }}"
      - "CSI Driver version: {{ k8s_tutum_csi_version }}"
      - "Kubernetes distribution: {{ k8s_distribution }}"
      - "Kubelet path: {{ _k8s_kubelet_path }}"
      - ""
      - "Components:"
      - "  - CSI Controller: {{ _csi_controller_ready.stdout | default('0') }}/1 ready"
      - "  - CSI Node: {{ _csi_node_ready.stdout | default('0/0') }} ready"
      - ""
      - "StorageClass: {{ k8s_tutum_csi_storage_class_name }}"
      - "Tutum Engine URL: {{ k8s_tutum_engine_url }}"
      - ""
      - "Usage example (PVC):"
      - "  apiVersion: v1"
      - "  kind: PersistentVolumeClaim"
      - "  metadata:"
      - "    name: my-cert"
      - "  spec:"
      - "    storageClassName: {{ k8s_tutum_csi_storage_class_name }}"
      - "    accessModes: [ReadOnlyMany]"
      - "    resources:"
      - "      requests:"
      - "        storage: 1Mi"
