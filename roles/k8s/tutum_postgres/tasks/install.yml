---
# Install PostgreSQL to Kubernetes

- name: Create namespace
  ansible.builtin.shell: kubectl create namespace {{ k8s_tutum_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Generate PostgreSQL Secret manifest
  ansible.builtin.template:
    src: secret.yml.j2
    dest: /tmp/tutum-postgres-secret.yml
    mode: '0600'

- name: Apply PostgreSQL Secret
  ansible.builtin.command: kubectl apply -f /tmp/tutum-postgres-secret.yml
  changed_when: true

- name: Generate PostgreSQL PVC manifest
  ansible.builtin.template:
    src: pvc.yml.j2
    dest: /tmp/tutum-postgres-pvc.yml
    mode: '0600'

- name: Apply PostgreSQL PVC
  ansible.builtin.command: kubectl apply -f /tmp/tutum-postgres-pvc.yml
  changed_when: true

- name: Generate PostgreSQL Deployment manifest
  ansible.builtin.template:
    src: deployment.yml.j2
    dest: /tmp/tutum-postgres-deployment.yml
    mode: '0600'

- name: Apply PostgreSQL Deployment
  ansible.builtin.command: kubectl apply -f /tmp/tutum-postgres-deployment.yml
  changed_when: true

- name: Generate PostgreSQL Service manifest
  ansible.builtin.template:
    src: service.yml.j2
    dest: /tmp/tutum-postgres-service.yml
    mode: '0600'

- name: Apply PostgreSQL Service
  ansible.builtin.command: kubectl apply -f /tmp/tutum-postgres-service.yml
  changed_when: true

# Cleanup temp files
- name: Remove temporary manifest files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/tutum-postgres-secret.yml
    - /tmp/tutum-postgres-pvc.yml
    - /tmp/tutum-postgres-deployment.yml
    - /tmp/tutum-postgres-service.yml

- name: Wait for PostgreSQL to be ready
  ansible.builtin.command: >
    kubectl rollout status deployment/tutum-postgres
    -n {{ k8s_tutum_namespace }} --timeout=300s
  changed_when: false

- name: Display PostgreSQL deployment info
  ansible.builtin.debug:
    msg:
      - "PostgreSQL deployed to namespace: {{ k8s_tutum_namespace }}"
      - "Service: tutum-postgres.{{ k8s_tutum_namespace }}.svc.cluster.local:{{ k8s_tutum_db_port }}"
      - "Database: {{ k8s_tutum_db_name }}"
      - "User: {{ k8s_tutum_db_user }}"
