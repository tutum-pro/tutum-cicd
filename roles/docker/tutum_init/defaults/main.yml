---
# docker_tutum_init role defaults

# Path for generated inventory file (relative to playbook execution directory)
docker_tutum_init_inventory_path: "inventory/"

# Generated inventory filename
docker_tutum_init_inventory_file: "docker.ini"

# Generated playbook filename
docker_tutum_init_playbook_file: "tutum-install.yml"

# Target hosts configuration
docker_tutum_init_target_host: "localhost"
docker_tutum_init_target_hostname: ""  # Optional: inventory hostname (default: same as target_host)
docker_tutum_init_ansible_connection: "local"
docker_tutum_init_ansible_python_interpreter: "/usr/bin/python3"

# SSH configuration (for remote hosts with ansible_connection=ssh)
docker_tutum_init_ansible_user: ""
docker_tutum_init_ansible_ssh_key: ""
docker_tutum_init_ansible_ssh_pass: ""  # SSH login password (use ansible-vault for production!)
docker_tutum_init_ansible_become_password: ""  # Sudo password (use ansible-vault in production!)

# Component versions
# IMPORTANT: These values MUST be synchronized with the respective role defaults:
#   - docker_tutum_engine_version  -> roles/docker/tutum_engine/defaults/main.yml
#   - docker_tutum_plugin_version  -> roles/docker/tutum_plugin/defaults/main.yml
#   - docker_tutum_cli_version     -> roles/docker/tutum_cli/defaults/main.yml
#   - docker_tutum_postgres_version -> roles/docker/tutum_postgres/defaults/main.yml
docker_tutum_engine_version: "4.2.2"
docker_tutum_plugin_version: "2.1.6"
docker_tutum_cli_version: "0.2.1"
docker_tutum_postgres_version: "15-alpine"

# Database mode: "embedded" or "external"
docker_tutum_init_db_mode: "embedded"

# External database URL (used when docker_tutum_init_db_mode is "external")
docker_tutum_init_external_db_url: ""

# Security keys (leave empty to auto-generate in playbook)
docker_tutum_init_master_key: ""
docker_tutum_init_jwt_secret: ""

# Database credentials (for embedded mode)
docker_tutum_init_db_name: "tutum"
docker_tutum_init_db_user: "tutum"
docker_tutum_init_db_password: "tutum"

# Ports
docker_tutum_init_rest_port: "8080"
docker_tutum_init_grpc_port: "9090"
docker_tutum_init_db_port: "5432"

# Overwrite existing files
docker_tutum_init_overwrite: false

# Become (sudo) settings for generated playbook
docker_tutum_init_become: true
