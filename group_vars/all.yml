---
# Default variables for all hosts
# Override these in inventory or host_vars as needed

# ===========================================
# Tutum Engine Configuration
# ===========================================
tutum_engine_version: "2.1.19"
postgres_version: "15-alpine"

# Database
db_name: "tutum"
db_user: "tutum"
db_password: "tutum"
db_port: "5432"

# Server
tutum_rest_port: "8080"
tutum_grpc_port: "9090"
tutum_log_level: "info"

# Directories
tutum_data_dir: "/var/lib/tutum"
tutum_config_dir: "/etc/tutum"

# Docker
docker_network: "tutum-network"

# ===========================================
# CSI Driver Plugin Configuration
# ===========================================
plugin_name: "tutumpro/tutum-csi-driver-docker"
plugin_version: "2.1.5"
tutum_engine_url: "localhost:9090"
volume_dir: "/var/lib/tutum/volumes"
log_level: "info"

# ===========================================
# Security (Override in production!)
# ===========================================
# Generate with: openssl rand -base64 32
# tutum_master_key: "CHANGE_ME"
# tutum_jwt_secret: "CHANGE_ME"
