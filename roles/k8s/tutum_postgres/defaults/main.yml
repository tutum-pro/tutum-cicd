---
# k8s_tutum_postgres role defaults

# Namespace (shared with tutum_engine)
k8s_tutum_namespace: "tutum-system"

# Deployment configuration
k8s_tutum_postgres_replicas: 1

# PostgreSQL image - auto-selected based on Kubernetes distribution
# OpenShift: uses quay.io/sclorg/postgresql-16-c9s (supports arbitrary UID)
# Standard: uses postgres:15-alpine (official image)
k8s_tutum_postgres_image: "{{ 'quay.io/sclorg/postgresql-16-c9s' if (k8s_distribution | default('standard')) == 'openshift' else 'postgres' }}"

# PostgreSQL version/tag - auto-selected based on distribution
# OpenShift: uses 'latest' tag (version 16 is in image name)
# Standard: uses '15-alpine' tag
k8s_tutum_postgres_version: "{{ 'latest' if (k8s_distribution | default('standard')) == 'openshift' else '15-alpine' }}"

k8s_tutum_postgres_image_pull_policy: "IfNotPresent"

# Image type: "standard" or "openshift"
# - standard: Official postgres image (uses POSTGRES_* env vars)
# - openshift: OpenShift/sclorg image (uses POSTGRESQL_* env vars)
# Auto-detected based on:
#   1. k8s_distribution (if openshift -> use openshift type)
#   2. Image name patterns (sclorg, rhscl, centos)
k8s_tutum_postgres_image_type: >-
  {{ 'openshift' if ((k8s_distribution | default('standard')) == 'openshift' or
     'sclorg' in k8s_tutum_postgres_image or
     'rhscl' in k8s_tutum_postgres_image or
     'centos/postgresql' in k8s_tutum_postgres_image)
     else 'standard' }}

# Resource limits
k8s_tutum_postgres_resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Database configuration
k8s_tutum_db_name: "tutum"
k8s_tutum_db_user: "tutum"
k8s_tutum_db_password: "tutum"  # Use ansible-vault in production!
k8s_tutum_db_port: "5432"

# Storage configuration
k8s_tutum_postgres_storage_class: ""  # Empty = default storage class
k8s_tutum_postgres_storage_size: "5Gi"

# Service configuration
k8s_tutum_postgres_service_type: "ClusterIP"

# Image registry credentials (for private registries)
k8s_tutum_registry_url: ""
k8s_tutum_registry_username: ""
k8s_tutum_registry_password: ""
k8s_tutum_registry_email: ""
k8s_tutum_registry_secret_name: "tutum-registry-secret"

# Action: present or absent
k8s_tutum_postgres_state: "present"

# Uninstall options
k8s_tutum_postgres_remove_data: false
