---
# Tutum Engine Installation Tasks

# ==================== Prerequisites ====================
- name: Verify Docker is running
  ansible.builtin.command: docker info
  changed_when: false
  register: _docker_info
  failed_when: _docker_info.rc != 0

- name: Create Tutum directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ docker_tutum_data_dir }}"
    - "{{ docker_tutum_data_dir }}/postgres"
    - "{{ docker_tutum_config_dir }}"
    - "{{ docker_tutum_config_dir }}/migrations"

# ==================== Docker Network ====================
- name: Create Docker network
  ansible.builtin.command: docker network create {{ docker_tutum_network }}
  register: _network_create
  changed_when: _network_create.rc == 0
  failed_when: _network_create.rc != 0 and 'already exists' not in _network_create.stderr

# ==================== PostgreSQL ====================
- name: Check if PostgreSQL container exists
  ansible.builtin.command: >
    docker ps -a --filter name={{ docker_tutum_postgres_container_name }} --format '{{ '{{' }}.Names{{ '}}' }}'
  register: _postgres_exists
  changed_when: false

- name: Stop existing PostgreSQL container
  ansible.builtin.command: docker stop {{ docker_tutum_postgres_container_name }}
  when: docker_tutum_postgres_container_name in _postgres_exists.stdout
  failed_when: false
  changed_when: true

- name: Remove existing PostgreSQL container
  ansible.builtin.command: docker rm {{ docker_tutum_postgres_container_name }}
  when: docker_tutum_postgres_container_name in _postgres_exists.stdout
  failed_when: false
  changed_when: true

- name: Pull PostgreSQL image
  ansible.builtin.command: docker pull postgres:{{ docker_tutum_postgres_version }}
  register: _pull_postgres
  changed_when: "'Downloaded' in _pull_postgres.stdout or 'Pull complete' in _pull_postgres.stdout"

- name: Start PostgreSQL container
  ansible.builtin.command: >
    docker run -d
    --name {{ docker_tutum_postgres_container_name }}
    --network {{ docker_tutum_network }}
    --label tutum-cicd.version={{ docker_tutum_cicd_version }}
    --label tutum-cicd.component=postgres
    --label tutum-cicd.image=postgres:{{ docker_tutum_postgres_version }}
    -e POSTGRES_DB={{ docker_tutum_db_name }}
    -e POSTGRES_USER={{ docker_tutum_db_user }}
    -e POSTGRES_PASSWORD={{ docker_tutum_db_password }}
    -e POSTGRES_INITDB_ARGS="--encoding=UTF8"
    -v {{ docker_tutum_data_dir }}/postgres:/var/lib/postgresql/data
    -p {{ docker_tutum_db_port }}:5432
    --health-cmd="pg_isready -U {{ docker_tutum_db_user }}"
    --health-interval=10s
    --health-timeout=5s
    --health-retries=5
    --restart unless-stopped
    postgres:{{ docker_tutum_postgres_version }}
  changed_when: true

- name: Wait for PostgreSQL to be healthy
  ansible.builtin.command: >
    docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' {{ docker_tutum_postgres_container_name }}
  register: _pg_health
  until: _pg_health.stdout == 'healthy'
  retries: 30
  delay: 2
  changed_when: false

# ==================== Database Schema & Migrations ====================
- name: Copy migration files
  ansible.builtin.copy:
    src: "{{ role_path }}/files/migrations/"
    dest: "{{ docker_tutum_config_dir }}/migrations/"
    mode: '0644'

- name: Create migrations tracking table
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      docker exec {{ docker_tutum_postgres_container_name }} psql -U {{ docker_tutum_db_user }} -d {{ docker_tutum_db_name }} -c "
        CREATE TABLE IF NOT EXISTS schema_migrations (
          id SERIAL PRIMARY KEY,
          version VARCHAR(255) NOT NULL UNIQUE,
          applied_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
          description TEXT
        );
      "
    executable: /bin/bash
  changed_when: true

- name: Check if schema is applied
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      docker exec {{ docker_tutum_postgres_container_name }} psql -U {{ docker_tutum_db_user }} -d {{ docker_tutum_db_name }} -t -c "
        SELECT COUNT(*) FROM information_schema.tables WHERE table_name = 'certificates';
      "
    executable: /bin/bash
  register: _schema_check
  changed_when: false

- name: Apply database schema
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      docker exec -i {{ docker_tutum_postgres_container_name }} psql -U {{ docker_tutum_db_user }} -d {{ docker_tutum_db_name }} \
        < {{ docker_tutum_config_dir }}/migrations/schema.sql
    executable: /bin/bash
  when: _schema_check.stdout | trim | int == 0
  changed_when: true

- name: Record schema migration
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      docker exec {{ docker_tutum_postgres_container_name }} psql -U {{ docker_tutum_db_user }} -d {{ docker_tutum_db_name }} -c "
        INSERT INTO schema_migrations (version, description)
        VALUES ('000_schema', 'Initial database schema')
        ON CONFLICT (version) DO NOTHING;
      "
    executable: /bin/bash
  changed_when: true

- name: Find migration files
  ansible.builtin.find:
    paths: "{{ docker_tutum_config_dir }}/migrations"
    patterns: "[0-9][0-9][0-9]_*.sql"
    excludes: "*.template"
  register: _migration_files

- name: Apply migrations in order
  vars:
    _migration_version: "{{ item.path | basename | regex_replace('\\.sql$', '') }}"
    _migration_name: "{{ item.path | basename }}"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      APPLIED=$(docker exec {{ docker_tutum_postgres_container_name }} psql -U {{ docker_tutum_db_user }} -d {{ docker_tutum_db_name }} -t -c \
        "SELECT COUNT(*) FROM schema_migrations WHERE version = '{{ _migration_version }}' OR version = '{{ _migration_name }}';" | tr -d ' ')

      if [ "$APPLIED" = "0" ]; then
        echo "Applying migration: {{ _migration_name }}"
        docker exec -i {{ docker_tutum_postgres_container_name }} psql -U {{ docker_tutum_db_user }} -d {{ docker_tutum_db_name }} < {{ item.path }}
        docker exec {{ docker_tutum_postgres_container_name }} psql -U {{ docker_tutum_db_user }} -d {{ docker_tutum_db_name }} -c \
          "INSERT INTO schema_migrations (version, description) \
           VALUES ('{{ _migration_version }}', 'Migration {{ _migration_name }}');"
        echo "CHANGED"
      else
        echo "Migration already applied: {{ _migration_name }}"
      fi
    executable: /bin/bash
  loop: "{{ _migration_files.files | sort(attribute='path') }}"
  register: _migration_result
  changed_when: "'CHANGED' in _migration_result.stdout"

# ==================== Tutum Engine ====================
- name: Check if Tutum Engine container exists
  ansible.builtin.command: >
    docker ps -a --filter name={{ docker_tutum_engine_container_name }} --format '{{ '{{' }}.Names{{ '}}' }}'
  register: _engine_exists
  changed_when: false

- name: Stop existing Tutum Engine container
  ansible.builtin.command: docker stop {{ docker_tutum_engine_container_name }}
  when: docker_tutum_engine_container_name in _engine_exists.stdout
  failed_when: false
  changed_when: true

- name: Remove existing Tutum Engine container
  ansible.builtin.command: docker rm {{ docker_tutum_engine_container_name }}
  when: docker_tutum_engine_container_name in _engine_exists.stdout
  failed_when: false
  changed_when: true

- name: Pull Tutum Engine image
  ansible.builtin.command: docker pull tutumpro/tutum-engine:{{ docker_tutum_engine_version }}
  register: _pull_engine
  changed_when: "'Downloaded' in _pull_engine.stdout or 'Pull complete' in _pull_engine.stdout"

- name: Get Docker socket group ID
  ansible.builtin.shell: stat -c '%g' /var/run/docker.sock
  register: _docker_socket_gid
  changed_when: false

- name: Start Tutum Engine container
  ansible.builtin.command: >
    docker run -d
    --name {{ docker_tutum_engine_container_name }}
    --network {{ docker_tutum_network }}
    --label tutum-cicd.version={{ docker_tutum_cicd_version }}
    --label tutum-cicd.component=engine
    --label tutum-cicd.image=tutumpro/tutum-engine:{{ docker_tutum_engine_version }}
    --group-add {{ _docker_socket_gid.stdout | trim }}
    -e DATABASE_URL=postgres://{{ docker_tutum_db_user }}:{{ docker_tutum_db_password }}@{{ docker_tutum_postgres_container_name }}:{{ docker_tutum_db_port }}/{{ docker_tutum_db_name }}?sslmode=disable
    -e DATABASE_MAX_OPEN_CONNS=25
    -e DATABASE_MAX_IDLE_CONNS=5
    -e DATABASE_CONN_MAX_LIFETIME=5m
    -e TUTUM_MASTER_KEY={{ docker_tutum_master_key }}
    -e TUTUM_REST_ADDR=:{{ docker_tutum_rest_port }}
    -e TUTUM_GRPC_ADDR=:{{ docker_tutum_grpc_port }}
    -e TUTUM_LOG_LEVEL={{ docker_tutum_log_level }}
    -e TUTUM_LOG_FORMAT=console
    -e TUTUM_JWT_SECRET={{ docker_tutum_jwt_secret }}
    -e TUTUM_JWT_EXPIRY=24h
    -e TUTUM_CERT_EXPIRY_WARNING_DAYS=30
    -e CREATE_NOT_EXISTING_OBJ=true
    -v /var/run/docker.sock:/var/run/docker.sock:ro
    -p {{ docker_tutum_rest_port }}:8080
    -p {{ docker_tutum_grpc_port }}:9090
    --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"
    --health-interval=30s
    --health-timeout=3s
    --health-start-period=10s
    --health-retries=3
    --restart unless-stopped
    tutumpro/tutum-engine:{{ docker_tutum_engine_version }}
  changed_when: true

- name: Wait for Tutum Engine to be healthy
  ansible.builtin.command: >
    docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' {{ docker_tutum_engine_container_name }}
  register: _engine_health
  until: _engine_health.stdout == 'healthy'
  retries: 30
  delay: 5
  changed_when: false

# ==================== Verification ====================
- name: Verify Tutum Engine REST API
  ansible.builtin.uri:
    url: "http://localhost:{{ docker_tutum_rest_port }}/health"
    method: GET
    status_code: 200
  register: _health_check
  retries: 5
  delay: 3
  until: _health_check.status == 200

- name: Display installation result
  ansible.builtin.debug:
    msg:
      - "Tutum Engine installed successfully!"
      - ""
      - "Services:"
      - "  - PostgreSQL: localhost:{{ docker_tutum_db_port }}"
      - "  - Tutum Engine REST API: http://localhost:{{ docker_tutum_rest_port }}"
      - "  - Tutum Engine gRPC API: localhost:{{ docker_tutum_grpc_port }}"
      - ""
      - "IMPORTANT - Save these secrets:"
      - "  - TUTUM_MASTER_KEY: {{ docker_tutum_master_key }}"
      - "  - TUTUM_JWT_SECRET: {{ docker_tutum_jwt_secret }}"
