---
# Tutum Platform - Full Kubernetes Installation
#
# Usage (embedded PostgreSQL - default):
#   ansible-playbook playbooks/install-tutum-k8s.yml
#
# Usage (external PostgreSQL):
#   ansible-playbook playbooks/install-tutum-k8s.yml \
#     -e k8s_tutum_db_mode=external \
#     -e k8s_tutum_postgres_host=192.168.1.100 \
#     -e k8s_tutum_db_password=secure-password
#
# Usage (external PostgreSQL with full URL):
#   ansible-playbook playbooks/install-tutum-k8s.yml \
#     -e k8s_tutum_db_mode=external \
#     -e k8s_tutum_external_db_url="postgres://user:pass@host:5432/dbname?sslmode=disable"
#
# For MicroK8s:
#   ansible-playbook playbooks/install-tutum-k8s.yml \
#     -e k8s_distribution=microk8s

- name: Install Tutum Platform on Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Database mode: "embedded" or "external"
    k8s_tutum_db_mode: "embedded"
    k8s_tutum_namespace: "tutum-system"
    k8s_tutum_registry_secret_name: "tutum-registry-secret"

  pre_tasks:
    - name: Create namespace
      ansible.builtin.shell: kubectl create namespace {{ k8s_tutum_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Create image pull secret for private registry (shared by all components)
      when: k8s_tutum_registry_url | default('') | length > 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ k8s_tutum_registry_secret_name }}"
            namespace: "{{ k8s_tutum_namespace }}"
            labels:
              app.kubernetes.io/name: tutum-system
              app.kubernetes.io/component: registry-credentials
              app.kubernetes.io/managed-by: ansible
          type: kubernetes.io/dockerconfigjson
          stringData:
            .dockerconfigjson: |
              {
                "auths": {
                  "{{ k8s_tutum_registry_url }}": {
                    "username": "{{ k8s_tutum_registry_username }}",
                    "password": "{{ k8s_tutum_registry_password }}",
                    "email": "{{ k8s_tutum_registry_email | default('') }}",
                    "auth": "{{ (k8s_tutum_registry_username ~ ':' ~ k8s_tutum_registry_password) | b64encode }}"
                  }
                }
              }

  roles:
    # Embedded PostgreSQL (only when db_mode=embedded)
    - role: tutum_pro.cicd.k8s.tutum_postgres
      when: k8s_tutum_db_mode == "embedded"

    # Tutum Engine (core service)
    - role: tutum_pro.cicd.k8s.tutum_engine

    # CSI Driver (certificate volumes)
    - role: tutum_pro.cicd.k8s.tutum_csi

  post_tasks:
    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "  Tutum Platform Installation Complete!"
          - "=========================================="
          - ""
          - "Namespace: {{ k8s_tutum_namespace }}"
          - ""
          - "PostgreSQL ({{ k8s_tutum_db_mode }}):"
          - "  {% if k8s_tutum_db_mode == 'embedded' %}- Service: tutum-postgres.{{ k8s_tutum_namespace }}.svc.cluster.local:5432{% else %}- External: {{ k8s_tutum_postgres_host | default(k8s_tutum_external_db_url) }}{% endif %}"
          - "  - Database: {{ k8s_tutum_db_name }}"
          - ""
          - "Tutum Engine:"
          - "  - REST API: http://tutum-engine.{{ k8s_tutum_namespace }}.svc.cluster.local:8080"
          - "  - gRPC API: tutum-engine.{{ k8s_tutum_namespace }}.svc.cluster.local:9090"
          - ""
          - "CSI Driver:"
          - "  - StorageClass: tutum-csi"
          - "  - Driver: csi.tutum.io"
          - ""
          - "Verify deployment:"
          - "  kubectl get pods -n {{ k8s_tutum_namespace }}"
          - "  kubectl get csidriver"
          - "  kubectl get storageclass tutum-csi"
