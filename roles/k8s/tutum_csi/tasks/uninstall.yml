---
# k8s_tutum_csi - Uninstall tasks

- name: Delete StorageClass
  ansible.builtin.command: kubectl delete storageclass {{ k8s_tutum_csi_storage_class_name }} --ignore-not-found=true
  changed_when: true

- name: Delete CSI Node DaemonSet
  ansible.builtin.command: kubectl delete daemonset tutum-csi-node -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete CSI Controller Deployment
  ansible.builtin.command: kubectl delete deployment tutum-csi-controller -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete CSIDriver
  ansible.builtin.command: kubectl delete csidriver {{ k8s_tutum_csi_driver_name }} --ignore-not-found=true
  changed_when: true

- name: Delete ServiceAccounts
  ansible.builtin.command: kubectl delete serviceaccount {{ item }} -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  loop:
    - tutum-csi-controller
    - tutum-csi-node
  changed_when: true

- name: Delete ClusterRoles
  ansible.builtin.command: kubectl delete clusterrole {{ item }} --ignore-not-found=true
  loop:
    - tutum-csi-controller-role
    - tutum-csi-node-role
  changed_when: true

- name: Delete ClusterRoleBindings
  ansible.builtin.command: kubectl delete clusterrolebinding {{ item }} --ignore-not-found=true
  loop:
    - tutum-csi-controller-binding
    - tutum-csi-node-binding
  changed_when: true

- name: Display uninstall result
  ansible.builtin.debug:
    msg:
      - "Tutum CSI Driver uninstalled from Kubernetes!"
      - "Namespace {{ k8s_tutum_namespace }} was NOT deleted (may contain other resources)."
