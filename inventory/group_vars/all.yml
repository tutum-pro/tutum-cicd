---
# =============================================================================
# Tutum CI/CD - Central Version Management
# =============================================================================
#
# This file contains all version definitions in one place.
# All playbooks reference these variables - DO NOT hardcode versions elsewhere.
#
# To upgrade a component:
#   1. Update the version here
#   2. Run: make bump TYPE=f (or c/b depending on change)
#   3. Commit changes
#
# =============================================================================

# -----------------------------------------------------------------------------
# CI/CD Version (for labeling deployed resources)
# -----------------------------------------------------------------------------

cicd_version: "{{ lookup('file', playbook_dir + '/../version', errors='ignore') | default('0.0.0') }}"

# -----------------------------------------------------------------------------
# Component Versions
# -----------------------------------------------------------------------------

# Tutum Engine
docker_tutum_engine_version: "4.2.0"

# Tutum Admin CLI
cli_version: "0.2.0"

# Tutum Docker Volume Plugin (CSI Driver)
plugin_version: "2.1.6"

# PostgreSQL
postgres_version: "15-alpine"

# -----------------------------------------------------------------------------
# Image Names (rarely change)
# -----------------------------------------------------------------------------

tutum_engine_image: "tutumpro/tutum-engine"
cli_image: "tutumpro/tutum-admin-cli"
plugin_image: "tutumpro/tutum-csi-driver-docker"

# -----------------------------------------------------------------------------
# Default Configuration
# -----------------------------------------------------------------------------

# Network
# docker_tutum_engine_url - used for tests and CLI (from host)
# tutum_engine_internal_url - used by plugin (plugin runs with --network host, so also uses localhost)
docker_tutum_engine_url: "localhost:9090"
docker_tutum_rest_port: "8080"
docker_tutum_grpc_port: "9090"

# Plugin URL (plugin uses --network host, so must use localhost)
tutum_engine_internal_url: "localhost:9090"

# Database
db_name: "tutum"
db_user: "tutum"
db_password: "tutum"
db_port: "5432"

# Security (IMPORTANT: Use fixed keys for test environments to avoid encryption mismatches)
# These keys MUST be exactly 32 characters for AES-256 encryption
docker_tutum_master_key: "TutumTestMasterKey32Characters!"
docker_tutum_jwt_secret: "TutumTestJwtSecret32Characters!!"

# Plugin
volume_dir: "/var/lib/tutum/volumes"
log_level: "info"

# Directories
docker_tutum_data_dir: "/var/lib/tutum"
docker_tutum_config_dir: "/etc/tutum"

# Docker
docker_tutum_network: "tutum-network"

# -----------------------------------------------------------------------------
# Container Names
# -----------------------------------------------------------------------------

cli_container_name: "tutum-admin-cli"
engine_container_name: "tutum-engine"
postgres_container_name: "tutum-postgres"

# -----------------------------------------------------------------------------
# Test Configuration
# -----------------------------------------------------------------------------

test_namespace: "n1"
test_group: "g1"
test_cert_name: "test-cert"
test_container_name: "tutum-test-busybox"
test_volume_name: "tutum-test-vol"
cleanup_after_test: true
