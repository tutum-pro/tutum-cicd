---
# docker_tutum_init - Generate Tutum Platform installation files

# ==================== Python Interpreter Autodiscovery ====================
- name: Autodiscover Python interpreter path
  when: docker_tutum_init_ansible_python_interpreter == "auto"
  block:
    - name: Get current Python interpreter path
      ansible.builtin.command: which python3
      register: _python3_path
      changed_when: false
      failed_when: false

    - name: Fallback to sys.executable if which fails
      ansible.builtin.set_fact:
        _discovered_python: "{{ ansible_playbook_python }}"
      when: _python3_path.rc != 0

    - name: Use discovered python3 path
      ansible.builtin.set_fact:
        _discovered_python: "{{ _python3_path.stdout | trim }}"
      when: _python3_path.rc == 0

    - name: Set autodiscovered Python interpreter
      ansible.builtin.set_fact:
        docker_tutum_init_ansible_python_interpreter: "{{ _discovered_python }}"

- name: Display Python interpreter
  ansible.builtin.debug:
    msg: "Using Python interpreter: {{ docker_tutum_init_ansible_python_interpreter }}"

# ==================== Directory Setup ====================
- name: Ensure inventory directory exists
  ansible.builtin.file:
    path: "{{ docker_tutum_init_inventory_path }}"
    state: directory
    mode: '0755'

- name: Check if inventory file exists
  ansible.builtin.stat:
    path: "{{ docker_tutum_init_inventory_path }}/{{ docker_tutum_init_inventory_file }}"
  register: _docker_tutum_init_inventory_exists

- name: Check if playbook file exists
  ansible.builtin.stat:
    path: "{{ docker_tutum_init_playbook_file }}"
  register: _docker_tutum_init_playbook_exists

- name: Generate inventory file
  ansible.builtin.template:
    src: docker.ini.j2
    dest: "{{ docker_tutum_init_inventory_path }}/{{ docker_tutum_init_inventory_file }}"
    mode: '0644'
  when: docker_tutum_init_overwrite | bool or not _docker_tutum_init_inventory_exists.stat.exists

- name: Generate installation playbook
  ansible.builtin.template:
    src: tutum-install.yml.j2
    dest: "{{ docker_tutum_init_playbook_file }}"
    mode: '0644'
  when: docker_tutum_init_overwrite | bool or not _docker_tutum_init_playbook_exists.stat.exists

- name: Display generated files info
  ansible.builtin.debug:
    msg:
      - "Tutum Platform installation files generated!"
      - ""
      - "Generated files:"
      - "  - Inventory: {{ docker_tutum_init_inventory_path }}/{{ docker_tutum_init_inventory_file }}"
      - "  - Playbook:  {{ docker_tutum_init_playbook_file }}"
      - ""
      - "To install Tutum Platform, run:"
      - "  ansible-playbook -i {{ docker_tutum_init_inventory_path }}/{{ docker_tutum_init_inventory_file }} {{ docker_tutum_init_playbook_file }}"
      - ""
      - "Database mode: {{ docker_tutum_init_db_mode }}"
