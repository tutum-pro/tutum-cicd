---
# Tutum Pro - Full Stack Installation (Docker)
# This playbook installs all Tutum components on Docker
#
# Usage from external project:
#   ansible-playbook tutum_pro.cicd.site
#
# Or with custom inventory:
#   ansible-playbook -i inventory/hosts.yml tutum_pro.cicd.site

- name: Install Tutum Pro Full Stack (Docker)
  hosts: all
  become: true
  roles:
    - role: tutum_pro.cicd.docker.tutum_engine
    - role: tutum_pro.cicd.docker.tutum_plugin
    - role: tutum_pro.cicd.docker.tutum_cli
