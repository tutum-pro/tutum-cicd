---
# Uninstall PostgreSQL from Kubernetes

- name: Delete PostgreSQL Service
  ansible.builtin.command: kubectl delete service tutum-postgres -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete PostgreSQL Deployment
  ansible.builtin.command: kubectl delete deployment tutum-postgres -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete PostgreSQL Secret
  ansible.builtin.command: kubectl delete secret tutum-postgres-secret -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete PostgreSQL PVC (if remove_data is true)
  ansible.builtin.command: kubectl delete pvc tutum-postgres-data -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true
  when: k8s_tutum_postgres_remove_data | bool

- name: Display uninstall info
  ansible.builtin.debug:
    msg:
      - "PostgreSQL removed from namespace: {{ k8s_tutum_namespace }}"
      - "PVC preserved: {{ not (k8s_tutum_postgres_remove_data | bool) }}"
