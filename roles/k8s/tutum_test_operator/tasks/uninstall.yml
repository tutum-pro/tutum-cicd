---
# k8s_tutum_test_operator - Uninstall tasks

- name: Delete test Deployment
  ansible.builtin.command: >
    kubectl delete deployment {{ k8s_tutum_test_app_name }}
    -n {{ k8s_tutum_test_deploy_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete TutumCertificate
  ansible.builtin.command: >
    kubectl delete tutumcertificate {{ k8s_tutum_test_cert_name }}
    -n {{ k8s_tutum_test_deploy_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete certificate from Tutum Engine via kubectl exec
  ansible.builtin.shell: |
    kubectl exec -n {{ k8s_tutum_namespace }} deploy/tutum-engine -- \
      wget -q -O - --method=DELETE \
      http://localhost:8080/api/v1/certificates/{{ k8s_tutum_test_cert_name }} 2>&1 || true
  register: _cert_delete_result
  changed_when: true
  failed_when: false

- name: Display uninstall result
  ansible.builtin.debug:
    msg:
      - "Tutum Operator Test uninstalled!"
      - ""
      - "Removed:"
      - "  - Deployment: {{ k8s_tutum_test_app_name }}"
      - "  - TutumCertificate: {{ k8s_tutum_test_cert_name }}"
      - "  - Certificate in Engine: {{ 'deleted' if _cert_delete_result.rc == 0 else 'not found or error' }}"
      - ""
      - "Note: Secret {{ k8s_tutum_test_cert_secret_name }} may be orphaned if operator deleted it."
