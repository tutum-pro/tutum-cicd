---
# k8s_tutum_engine - Uninstall tasks

- name: Delete Ingress resources
  ansible.builtin.command: kubectl delete ingress tutum-engine tutum-engine-grpc -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete OpenShift Route
  ansible.builtin.command: kubectl delete route tutum-engine -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true
  when: k8s_distribution | default('standard') == 'openshift'

- name: Delete tutum-engine Deployment
  ansible.builtin.command: kubectl delete deployment tutum-engine -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete tutum-engine Services
  ansible.builtin.command: kubectl delete service {{ item }} -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  loop:
    - tutum-engine
    - tutum-engine-headless
  changed_when: true

- name: Delete tutum-engine ConfigMaps
  ansible.builtin.command: kubectl delete configmap {{ item }} -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  loop:
    - tutum-engine-config
    - tutum-engine-migrations
  changed_when: true

- name: Delete tutum-engine Secret
  ansible.builtin.command: kubectl delete secret tutum-engine-secret -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete tutum-engine ServiceAccount
  ansible.builtin.command: kubectl delete serviceaccount tutum-engine -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete migration Jobs
  ansible.builtin.command: kubectl delete job -l app.kubernetes.io/name=tutum-engine-migrations -n {{ k8s_tutum_namespace }} --ignore-not-found=true
  changed_when: true

- name: Delete ClusterRole
  ansible.builtin.command: kubectl delete clusterrole tutum-engine-pod-restarter --ignore-not-found=true
  changed_when: true

- name: Delete ClusterRoleBinding
  ansible.builtin.command: kubectl delete clusterrolebinding tutum-engine-pod-restarter --ignore-not-found=true
  changed_when: true

- name: Display uninstall result
  ansible.builtin.debug:
    msg:
      - "Tutum Engine uninstalled from Kubernetes!"
      - "Namespace {{ k8s_tutum_namespace }} was NOT deleted (may contain other resources)."
