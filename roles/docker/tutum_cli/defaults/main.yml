---
# Docker CLI Role Defaults

# CLI version
docker_tutum_cli_version: "0.1.76"
docker_tutum_cli_image: "tutumpro/tutum-admin-cli"

# CI/CD version for labeling
docker_tutum_cicd_version: "{{ lookup('file', role_path + '/../../../version', errors='ignore') | default('0.0.0') }}"

# Container name
docker_tutum_cli_container_name: "tutum-admin-cli"

# Tutum Engine connection
docker_tutum_engine_url: "localhost:9090"
docker_tutum_rest_port: "8080"

# Action: install or uninstall
docker_tutum_cli_state: "present"
