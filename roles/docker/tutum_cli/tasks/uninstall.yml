---
# Tutum Admin CLI Uninstallation Tasks

- name: Stop CLI container
  ansible.builtin.command: docker stop "{{ docker_tutum_cli_container_name }}"
  failed_when: false
  changed_when: true

- name: Remove CLI container
  ansible.builtin.command: docker rm "{{ docker_tutum_cli_container_name }}"
  failed_when: false
  changed_when: true

- name: Display result
  ansible.builtin.debug:
    msg: "Tutum Admin CLI container {{ docker_tutum_cli_container_name }} has been removed."
