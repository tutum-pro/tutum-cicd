---
# k8s_tutum_init role defaults
# Generator for Kubernetes installation playbook and inventory

# Output paths
k8s_tutum_init_output_path: "."
k8s_tutum_init_inventory_path: "inventory"
k8s_tutum_init_inventory_file: "k8s.ini"
k8s_tutum_init_playbook_file: "tutum-k8s-install.yml"
k8s_tutum_init_uninstall_playbook_file: "tutum-k8s-uninstall.yml"

# Generate uninstall playbook
k8s_tutum_init_generate_uninstall: true

# Overwrite existing files
k8s_tutum_init_overwrite: false

# Python interpreter for local execution
# Set to "auto" to autodiscover the current Python interpreter
# or provide explicit path like "/usr/bin/python3"
k8s_tutum_init_ansible_python_interpreter: "auto"

# Component versions
# IMPORTANT: These values MUST be synchronized with the respective role defaults
k8s_tutum_engine_version: "5.1.5"
k8s_tutum_csi_version: "4.0.1"

# Embedded PostgreSQL configuration (only for db_mode=embedded)
# Image auto-selected based on distribution:
# - OpenShift: quay.io/sclorg/postgresql-16-c9s (supports arbitrary UID, restricted-v2 SCC)
# - Standard K8s: postgres:15-alpine (official image)
k8s_tutum_postgres_image: "{{ 'quay.io/sclorg/postgresql-16-c9s' if k8s_tutum_init_distribution == 'openshift' else 'postgres' }}"
k8s_tutum_postgres_version: "{{ 'latest' if k8s_tutum_init_distribution == 'openshift' else '15-alpine' }}"

# Namespace
k8s_tutum_namespace: "tutum-system"

# Kubernetes distribution
# Options: "standard", "microk8s", "k3s", "rke2", "openshift"
k8s_tutum_init_distribution: "standard"

# ==================== Kubectl Configuration ====================

# Kubectl command wrapper (auto-selected based on distribution)
# - OpenShift: "oc" (OpenShift CLI, backwards compatible with kubectl)
# - MicroK8s: "microk8s kubectl" (MicroK8s wrapper)
# - k3s: "k3s kubectl" (k3s wrapper)
# - RKE2: "kubectl" (standard kubectl, but may need custom KUBECONFIG)
# - Standard: "kubectl" (standard kubectl)
#
# You can override with full path if binary is not in PATH:
# k8s_kubectl_command: "/usr/local/bin/kubectl"
k8s_kubectl_command: >-
  {{ 'oc' if k8s_tutum_init_distribution == 'openshift'
     else 'microk8s kubectl' if k8s_tutum_init_distribution == 'microk8s'
     else 'k3s kubectl' if k8s_tutum_init_distribution == 'k3s'
     else 'kubectl' }}

# Path to kubectl binary (optional, leave empty for PATH lookup)
# Useful when kubectl/oc is installed in non-standard location
# Example: "/opt/k8s/bin/kubectl" or "/usr/local/bin/oc"
k8s_kubectl_bin_path: ""

# KUBECONFIG file path (optional, leave empty to use default ~/.kube/config)
# Required for:
# - RKE2: /etc/rancher/rke2/rke2.yaml
# - k3s: /etc/rancher/k3s/k3s.yaml
# - Custom installations with non-default config location
#
# Example: "/etc/rancher/rke2/rke2.yaml"
k8s_kubectl_kubeconfig: ""

# Database mode: "embedded", "cnpg" or "external"
# embedded: Deploys simple PostgreSQL in Kubernetes (tutum_postgres role)
# cnpg: Deploys CloudNativePG cluster (tutum_cnpg role) - recommended for production
# external: Uses external PostgreSQL (requires k8s_tutum_init_postgres_host)
k8s_tutum_init_db_mode: "embedded"

# CNPG configuration (only for db_mode=cnpg)
k8s_tutum_cnpg_operator_version: "1.25.0"
k8s_tutum_cnpg_postgres_version: "16"
k8s_tutum_cnpg_instances: 1
k8s_tutum_cnpg_storage_size: "5Gi"
k8s_tutum_cnpg_enable_pooler: false

# PostgreSQL connection (required for external mode)
k8s_tutum_init_postgres_host: ""
k8s_tutum_init_postgres_port: "5432"
k8s_tutum_init_postgres_db: "tutum"
k8s_tutum_init_postgres_user: "tutum"
k8s_tutum_init_postgres_password: "tutum"

# External database URL (alternative to individual settings)
# Format: postgres://user:password@host:port/dbname?sslmode=disable
k8s_tutum_init_external_db_url: ""

# Security keys (leave empty to auto-generate)
k8s_tutum_init_master_key: ""
k8s_tutum_init_jwt_secret: ""

# Generate components
k8s_tutum_init_generate_postgres: true  # Only used when db_mode=embedded/cnpg
k8s_tutum_init_generate_engine: true

# Certificate injection mode: "csi" or "operator"
# csi: Uses CSI driver (requires privileged containers, real-time mounts)
# operator: Uses Kubernetes operator (rootless, syncs certificates to Secrets)
k8s_tutum_init_injection_mode: "csi"

# Operator configuration (only for injection_mode=operator)
k8s_tutum_operator_version: "0.1.12"
k8s_tutum_operator_sync_interval: "5m"
# Namespace watching mode:
# - "" (empty): watch all namespaces (cluster-wide)
# - "ns1,ns2": watch only specific namespaces
k8s_tutum_operator_watch_namespaces: ""
# CRD installation control (useful when you lack cluster-admin permissions)
# Set to true to skip automatic CRD installation and generate manifest for manual installation
k8s_tutum_operator_skip_crd_install: false
# Path where CRD manifest will be saved for manual installation by cluster admin
k8s_tutum_operator_crd_manifest_path: "./tutum-operator-crd.yml"

# Test operator deployment namespace
# K8s namespace where tutum_test_operator will deploy test app and TutumCertificate CR
k8s_tutum_test_deploy_namespace: "tutum-system"

# REST API base path (for multi-instance deployments)
# This value is used consistently for both Tutum Engine service and Ingress
# Example: "/api" or "/tutum/api" or "/instance1/api"
k8s_tutum_rest_base_path: ""

# Ingress configuration
k8s_tutum_init_ingress_enabled: false
k8s_tutum_init_ingress_class_name: "nginx"
k8s_tutum_init_ingress_host: ""
# Note: k8s_tutum_init_ingress_path is derived from k8s_tutum_rest_base_path if set
k8s_tutum_init_ingress_path: "/api"
k8s_tutum_init_ingress_tls_enabled: false
k8s_tutum_init_ingress_tls_secret_name: ""
k8s_tutum_init_ingress_cert_manager_issuer: ""

# OpenShift Route configuration (only for k8s_tutum_init_distribution=openshift)
# When distribution is "openshift", Route is used instead of Ingress
k8s_tutum_init_route_termination: "edge"  # edge, passthrough, reencrypt
k8s_tutum_init_route_insecure_edge_termination_policy: "Redirect"  # Allow, Redirect, None

# Image registry credentials (for private/on-prem registries)
# These credentials will be used to create imagePullSecrets in Kubernetes
# Leave empty for public registries like Docker Hub
k8s_tutum_init_registry_url: ""           # Registry URL (e.g., registry.example.com)
k8s_tutum_init_registry_username: ""      # Registry username
k8s_tutum_init_registry_password: ""      # Registry password
k8s_tutum_init_registry_email: ""         # Registry email (optional)
k8s_tutum_init_registry_secret_name: "tutum-registry-secret"  # Name of the imagePullSecret
