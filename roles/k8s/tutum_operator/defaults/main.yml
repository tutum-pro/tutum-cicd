---
# k8s_tutum_operator role defaults

# Component versions
k8s_tutum_operator_version: "0.1.12"

# Namespace
k8s_tutum_namespace: "tutum-system"

# Images
k8s_tutum_operator_image: "tutumpro/tutum-operator-k8s"

# Tutum Engine connection
k8s_tutum_engine_url: "tutum-engine.tutum-system.svc.cluster.local:9090"

# Operator configuration
k8s_tutum_operator_sync_interval: "5m"
k8s_tutum_operator_log_level: "info"

# Namespace watching mode:
# - "" (empty): watch all namespaces (cluster-wide, requires ClusterRole)
# - "tutum-system": watch only operator's namespace (single namespace mode)
# - "ns1,ns2,ns3": watch specific namespaces (multi-namespace mode)
k8s_tutum_operator_watch_namespaces: ""

# Controller resources
k8s_tutum_operator_resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

# Image registry credentials (for private registries)
k8s_tutum_registry_url: ""
k8s_tutum_registry_secret_name: "tutum-registry-secret"

# Action: present or absent
k8s_tutum_operator_state: "present"

# CRD installation control
# Set to true to skip automatic CRD installation (useful when cluster-admin is required)
# CRD manifest will still be generated at k8s_tutum_operator_crd_manifest_path
k8s_tutum_operator_skip_crd_install: false

# Path where CRD manifest will be saved for manual installation by cluster admin
# Default: current directory
k8s_tutum_operator_crd_manifest_path: "./tutum-operator-crd.yml"
