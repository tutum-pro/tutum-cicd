---
# Tutum Pro - Full Stack Uninstallation (Docker)
#
# Usage:
#   ansible-playbook tutum_pro.cicd.uninstall
#
# With data removal:
#   ansible-playbook tutum_pro.cicd.uninstall -e docker_tutum_engine_remove_data=true

- name: Uninstall Tutum Pro Full Stack (Docker)
  hosts: all
  become: true
  roles:
    - role: tutum_pro.cicd.docker.tutum_cli
      vars:
        docker_tutum_cli_state: "absent"

    - role: tutum_pro.cicd.docker.tutum_plugin
      vars:
        docker_tutum_plugin_state: "absent"

    - role: tutum_pro.cicd.docker.tutum_engine
      vars:
        docker_tutum_engine_state: "absent"

    # PostgreSQL - skip if external database was used
    - role: tutum_pro.cicd.docker.tutum_postgres
      vars:
        docker_tutum_postgres_state: "absent"
      when: docker_tutum_external_db_url | default('') | length == 0
