---
# Tutum Engine Role - Main Tasks
# Installs or uninstalls Tutum Engine with PostgreSQL

- name: Include install tasks
  ansible.builtin.include_tasks: install.yml
  when: docker_tutum_engine_state == "present"

- name: Include uninstall tasks
  ansible.builtin.include_tasks: uninstall.yml
  when: docker_tutum_engine_state == "absent"
