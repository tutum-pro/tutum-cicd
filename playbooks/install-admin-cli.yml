---
# Ansible Playbook: Install Tutum Admin CLI Container
#
# Usage:
#   ansible-playbook -i inventory install-admin-cli.yml
#
# Variables:
#   cli_image: tutumpro/tutum-admin-cli
#   cli_version: 0.2.0
#   cli_container_name: tutum-admin-cli

- name: Install Tutum Admin CLI Container
  hosts: all
  become: true
  vars:
    # CI/CD version for labeling
    _cicd_version: "{{ cicd_version }}"

    # All versions and defaults defined in inventory/group_vars/all.yml
    _cli_name: "{{ cli_image }}"
    _cli_version: "{{ cli_version }}"
    _cli_full_name: "{{ _cli_name }}:{{ _cli_version }}"
    _cli_container_name: "{{ cli_container_name }}"
    _docker_tutum_engine_url: "{{ docker_tutum_engine_url }}"

  tasks:
    - name: Verify Docker is running
      ansible.builtin.command: docker info
      changed_when: false
      register: docker_info
      failed_when: docker_info.rc != 0

    - name: Pull Tutum Admin CLI image from registry
      ansible.builtin.command: docker pull "{{ _cli_full_name }}"
      register: pull_result
      changed_when: "'Downloaded' in pull_result.stdout or 'Pull complete' in pull_result.stdout"

    - name: Stop existing container if running
      ansible.builtin.command: docker stop "{{ _cli_container_name }}"
      failed_when: false
      changed_when: true

    - name: Remove existing container
      ansible.builtin.command: docker rm "{{ _cli_container_name }}"
      failed_when: false
      changed_when: true

    - name: Create Tutum Admin CLI container
      ansible.builtin.shell:
        cmd: |
          docker create \
            --name {{ _cli_container_name }} \
            --network host \
            --restart unless-stopped \
            --label tutum-cicd.version={{ _cicd_version }} \
            --label tutum-cicd.component=cli \
            --label tutum-cicd.image={{ _cli_full_name }} \
            -e TUTUM_ENGINE_URL={{ _docker_tutum_engine_url }} \
            -e TUTUM_ENGINE_REST_URL=http://{{ _docker_tutum_engine_url.split(':')[0] }}:8080 \
            -e TUTUM_USE_TLS=false \
            --entrypoint sh \
            {{ _cli_full_name }} \
            -c "while true; do sleep 86400; done"
      register: container_create
      changed_when: true

    - name: Start Tutum Admin CLI container
      ansible.builtin.command: docker start "{{ _cli_container_name }}"
      changed_when: true

    - name: Verify container is running
      ansible.builtin.command: docker ps --filter "name={{ _cli_container_name }}" --format "{{ '{{' }}.Names{{ '}}' }}"
      register: container_check
      changed_when: false
      failed_when: _cli_container_name not in container_check.stdout

    - name: Display installation result
      ansible.builtin.debug:
        msg: |
          Tutum Admin CLI container installed successfully!

          Container: {{ _cli_container_name }}
          Image: {{ _cli_full_name }}

          Usage:
            docker exec {{ _cli_container_name }} tutum-admin-cli --help
            docker exec {{ _cli_container_name }} tutum-admin-cli cert list --server {{ _docker_tutum_engine_url }}
            docker exec {{ _cli_container_name }} tutum-admin-cli namespace list --server {{ _docker_tutum_engine_url }}
