---
# Tutum Platform - Prepare Offline Bundle
#
# This playbook creates an offline bundle containing all Docker images,
# Ansible collection, and installation scripts for air-gapped deployment.
#
# Basic usage (embedded PostgreSQL + CSI driver):
#   ansible-playbook playbooks/prepare-offline-bundle.yml \
#     -e k8s_tutum_offline_output_path=./tutum-bundle
#
# With CNPG and operator:
#   ansible-playbook playbooks/prepare-offline-bundle.yml \
#     -e k8s_tutum_offline_output_path=./tutum-bundle \
#     -e k8s_tutum_offline_db_mode=cnpg \
#     -e k8s_tutum_offline_injection_mode=operator
#
# From existing inventory:
#   ansible-playbook playbooks/prepare-offline-bundle.yml \
#     -e k8s_tutum_offline_output_path=./tutum-bundle \
#     -e k8s_tutum_offline_inventory_path=./inventory/k8s.ini
#
# With internal registry retagging:
#   ansible-playbook playbooks/prepare-offline-bundle.yml \
#     -e k8s_tutum_offline_output_path=./tutum-bundle \
#     -e k8s_tutum_offline_internal_registry=registry.example.com \
#     -e k8s_tutum_offline_internal_prefix=tutum
#
# Requirements:
#   - Docker must be installed and running
#   - Internet access to pull images and download collection
#   - Sufficient disk space for images (typically 1-3 GB)

- name: Prepare Tutum Platform offline bundle
  hosts: localhost
  connection: local
  gather_facts: true

  roles:
    - role: tutum_pro.cicd.k8s.tutum_offline_bundle
