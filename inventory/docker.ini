# Example Ansible Inventory for Tutum Docker Plugin Installation
#
# Copy this file to 'inventory' and modify to match your environment

[docker_hosts]
# Single host
docker-host-1 ansible_host=docker

# Multiple hosts
# docker-host-2 ansible_host=192.168.1.11
# docker-host-3 ansible_host=192.168.1.12

[docker_hosts:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_become_password=opsakl22

# Configuration (optional overrides - defaults in group_vars/all.yml)
# volume_dir=/var/lib/tutum/volumes
# log_level=info

# For different environments, create groups:

# Plugin configuration
docker_tutum_plugin_version=3.0.0

[production]
# prod-docker-1 ansible_host=10.0.1.10
# prod-docker-2 ansible_host=10.0.1.11

[production:vars]
log_level=warn

[staging]
# staging-docker-1 ansible_host=10.0.2.10

[staging:vars]
log_level=debug
